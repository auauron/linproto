<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinTech UI prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a shipped staff web app, recreated from the LinTech Figma file (UI v1.1)
   IDEA: CPU Waterlab's own screens, clickable, with mock data
   PICTURE: each screen itself
   COLOUR and TYPE: Figma variables (CPU navy + gold), Inter
   LAYOUT: 248px navy sidebar, 77px top bar, card grid; stacks on narrow screens */
:root{color-scheme:light;
--primary:#262a7a;--primary-dark:#191c55;--primary-soft:#e9eaf7;--bg:#f5f6fa;--surface:#fff;--sidebar:#161a4d;--sidebar-text:#bcc0e0;
--border:#e1e3ee;--text:#111433;--muted:#5e6382;--danger:#dc2626;--danger-soft:#fee2e2;--success:#15803d;--success-soft:#dcfce7;
--warning:#b45309;--warning-soft:#fef3c7;--info:#2457c5;--info-soft:#e0e9fb;--violet:#6d28d9;--violet-soft:#ede9fe;--slate:#475569;--slate-soft:#e2e8f0;
--accent:#f2b705;--accent-soft:#fff5cf;--accent-dark:#8a6400}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.seal{display:block;border-radius:50%;object-fit:contain}
/* app shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;position:relative}
.app::before{content:"";position:fixed;left:0;right:0;top:0;height:4px;background:var(--accent);z-index:30}
.side{background:var(--sidebar);padding:28px 16px 80px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding-left:8px;margin-bottom:28px}
.brand b{display:block;color:#fff;font-size:16px;line-height:20px}
.brand small{display:block;color:var(--sidebar-text);font-size:11px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-radius:8px;color:var(--sidebar-text);font-weight:500;text-decoration:none;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:var(--accent);color:var(--sidebar);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.main{display:flex;flex-direction:column;min-height:100vh}
.top{background:var(--surface);border-bottom:1px solid var(--border);min-height:77px;padding:14px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.top .crumb{font-size:12px;color:var(--muted)}
.top h1{margin:0;font-size:22px;line-height:28px;font-weight:700}
.who{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.user{display:flex;align-items:center;gap:10px}
.av{width:35px;height:33px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-size:12px;font-weight:700}
.user b{display:block;font-size:13px;font-weight:600}.user small{display:block;font-size:11px;color:var(--muted)}
.content{padding:24px 32px 96px;display:flex;flex-direction:column;gap:20px}
/* components */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:37px;padding:0 16px;border-radius:8px;border:1px solid transparent;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;background:none}
.btn:focus-visible,.nav a:focus-visible,input:focus-visible,.seg button:focus-visible,.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-dark)}
.btn.secondary{background:#fff;border-color:var(--border);color:var(--text);height:39px}.btn.secondary:hover{background:var(--bg)}
.btn.danger{background:var(--danger);color:#fff}
.btn.ghost{color:var(--primary);padding:0 12px}.btn.ghost:hover{background:var(--primary-soft)}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.badge{display:inline-flex;align-items:center;gap:6px;height:23px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-pending{background:var(--slate-soft);color:var(--slate)}.b-testing{background:var(--info-soft);color:var(--info)}
.b-verif{background:var(--warning-soft);color:var(--warning)}.b-ready{background:var(--violet-soft);color:var(--violet)}.b-released{background:var(--success-soft);color:var(--success)}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.warnp{background:var(--warning-soft);color:var(--warning)}.pill.ok{background:var(--success-soft);color:var(--success)}.pill.off{background:var(--slate-soft);color:var(--slate)}.pill.bad{background:var(--danger-soft);color:var(--danger)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:21px}
.card h2{margin:0;font-size:16px;font-weight:600;line-height:20px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.chead .meta{font-size:13px;color:var(--muted)}
.grid{display:grid;gap:20px;align-content:start}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;gap:20px;align-items:start}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.right{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}
.stat .l{font-size:13px;color:var(--muted)}.stat .n{font-size:30px;font-weight:700;line-height:40px;margin:2px 0 8px}.stat .s{font-size:12px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.row>.field{flex:1 1 160px}
.field label{font-size:13px;font-weight:500}
.field select{appearance:auto}
.field input,.field select,.field textarea{height:39px;border:1px solid var(--border);border-radius:8px;background:#fff;padding:0 12px;font-size:14px;width:100%}
.field textarea{height:auto;padding:10px 12px;resize:vertical}
.field input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.field.err input{border-color:var(--danger)}
.field.dis input{background:var(--bg);color:var(--muted)}
.field .help{font-size:12px;color:var(--muted)}.field.err .help{color:var(--danger)}
.field .help.chg{color:var(--warning)}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:8px;padding:11px 14px;font-size:13px;line-height:18px}
.banner::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:currentColor;margin-top:6px}
.banner.info{background:var(--info-soft);color:var(--info)}.banner.danger{background:var(--danger-soft);color:var(--danger)}
.banner.warn{background:var(--warning-soft);color:var(--warning)}.banner.ok{background:var(--success-soft);color:var(--success)}
.banner b{display:block}.banner small{display:block;font-size:12px}
.tw{border:1px solid var(--border);border-radius:8px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--bg);text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:10px 16px;white-space:nowrap}
td{padding:13px 16px;border-top:1px solid var(--border);vertical-align:middle}
td.num,th.num{text-align:right;white-space:nowrap}
td.nw{white-space:nowrap}
td b{white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:#fafbfe}
tr.sel td{background:var(--primary-soft)}
tr.sec td{background:var(--primary-soft);color:var(--primary);font-size:11px;font-weight:700;padding:7px 16px;letter-spacing:.02em}
tr.bad td{background:#fff5f5}
tr.tot td{font-weight:700;background:var(--bg)}
td input{height:34px;border:1px solid var(--border);border-radius:8px;padding:0 10px;width:100%;min-width:90px;background:#fff}
td input.bad{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
.flag{display:inline-block;margin-top:4px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px}
.flag.hi{background:var(--danger-soft);color:var(--danger)}.flag.ok{background:var(--success-soft);color:var(--success)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0}
.kv span:first-child{color:var(--muted)}.kv span:last-child{text-align:right;font-weight:500}
.hr{border-top:1px solid var(--border);margin:8px 0}
.facts{display:flex;flex-wrap:wrap;gap:16px 44px}
.facts div span{display:block;font-size:12px;color:var(--muted)}.facts div b{font-size:14px;font-weight:600}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:7px;height:32px;padding:0 14px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(17,20,51,.12)}
.chk{display:flex;align-items:center;gap:10px;min-height:30px;cursor:pointer;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--primary);margin:0;flex:none}
.chk .p{margin-left:auto;color:var(--muted);white-space:nowrap}
.cap{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.02em;margin:14px 0 6px}
.note{font-size:12px;color:var(--muted)}
.total{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.total b{font-size:15px}.total strong{font-size:22px;color:var(--primary);white-space:nowrap}
.stepper{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;height:31px;padding:0 12px;border-radius:999px;font-size:13px;color:var(--muted)}
.step i{font-style:normal;width:22px;height:19px;border-radius:999px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--slate-soft)}
.step.on{background:var(--primary-soft);color:var(--text);font-weight:600}.step.on i,.step.done i{background:var(--primary);color:#fff}
.step.done{color:var(--text)}
.stepper .ln{width:36px;height:1px;background:var(--border)}
.sugg{border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 6px 18px rgba(17,20,51,.08);margin-top:14px}
.sugg .h{background:var(--bg);font-size:12px;color:var(--muted);padding:8px 14px}
.sitem{display:flex;align-items:center;gap:16px;padding:10px 14px;border-top:1px solid var(--border);flex-wrap:wrap}
.sitem.on{background:var(--primary-soft)}
.sitem .t{flex:1 1 220px}.sitem b{display:block;font-weight:600}.sitem small{color:var(--muted);font-size:12px}
.sitem .m{font-size:12px;color:var(--muted);white-space:nowrap}
.mini{border:1px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;background:#fff;text-align:left}
.mini b{display:block;font-size:13px;font-weight:600}.mini small{font-size:12px;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 14px 26px}
.tl li::before{content:"";position:absolute;left:3px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--primary)}
.tl li::after{content:"";position:absolute;left:7px;top:17px;bottom:0;width:2px;background:var(--border)}
.tl li:last-child::after{display:none}
.tl li.gold::before{background:var(--accent)}.tl li.todo::before{background:var(--slate-soft)}
.tl b{display:block;font-size:14px;font-weight:600}.tl li.todo b{font-weight:500;color:var(--muted)}.tl small{font-size:12px;color:var(--muted)}
/* paper documents */
.paper{background:#fff;max-width:820px;width:100%;margin:0 auto;padding:44px 48px;box-shadow:0 8px 30px rgba(17,20,51,.12);border-radius:2px;font-size:13px}
.paper .hd{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:18px}
.paper .hd h3{margin:8px 0 0;font-size:16px;font-weight:700}.paper .hd h4{margin:4px 0 0;font-size:13px;font-weight:700}
.paper .hd p{margin:2px 0;font-size:11px;color:var(--muted)}
.paper .ttl{color:var(--primary);font-weight:700;font-size:14px;margin-top:8px}
.paper .mf{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:4px 40px;margin-bottom:16px}
.paper .mf div{font-size:12px}.paper .mf span{color:var(--muted)}.paper .mf b{font-weight:600}
.paper table{font-size:12px}.paper td{padding:9px 12px}.paper th{padding:9px 12px;white-space:normal}
.sig{display:flex;justify-content:space-between;gap:40px;margin-top:20px;flex-wrap:wrap}
.sig div{min-width:220px}.sig .ln{border-bottom:1px solid var(--text);height:30px;margin:6px 0 6px}
.sig b{display:block;font-size:13px}.sig small{color:var(--muted);font-size:12px}
.nf{text-align:center;letter-spacing:.35em;font-size:11px;color:var(--muted);margin:14px 0}
.receipt{background:#fff;border:1px solid var(--border);border-radius:12px;padding:28px}
.receipt .hd{text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;margin-bottom:12px}
.receipt .hd b{font-size:13px}.receipt .hd small{font-size:10px;color:var(--muted)}
.receipt .hd .rt{font-size:15px;color:var(--primary);font-weight:700;margin-top:6px}
/* label */
.label{border:2px dashed var(--muted);border-radius:8px;padding:18px 20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.label .lt{flex:1 1 320px;display:flex;flex-direction:column;gap:8px}
.label .lh{display:flex;justify-content:space-between;font-size:10px;font-weight:600;color:var(--muted)}
.label .rq{font-size:26px;font-weight:700;line-height:30px}
.label .ln{font-size:13px;color:var(--primary);font-weight:600}
.chip{display:inline-block;background:var(--primary-soft);color:var(--primary);font-size:11px;font-weight:600;padding:4px 8px;border-radius:6px;margin-right:6px}
.qr{text-align:center;font-size:10px;color:var(--muted)}
.qr svg{width:110px;height:110px;display:block;margin-bottom:4px}
/* sign in */
.signin{display:grid;grid-template-columns:minmax(0,620fr) minmax(0,820fr);min-height:100vh}
.bp{background:var(--sidebar);color:#fff;padding:64px;display:flex;flex-direction:column;justify-content:center;gap:20px}
.bp h1{font-size:40px;line-height:46px;margin:0;font-weight:700;max-width:492px}
.bp .gold{width:64px;height:3px;background:var(--accent)}
.bp p{margin:0;color:var(--sidebar-text);font-size:16px;max-width:492px}
.bp .motto{color:var(--accent);font-size:12px;font-weight:600;letter-spacing:.12em}
.sf{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:22px}
.sc{background:#fff;border:1px solid var(--border);border-radius:14px;padding:32px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
.sc h2{margin:0;font-size:24px}.sc p{margin:-8px 0 0;color:var(--muted);font-size:13px}
.shortcuts{text-align:center}.shortcuts small{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:8px}
.shortcuts .right{justify-content:center;gap:8px}
/* index */
.index{max-width:1328px;margin:0 auto;padding:48px 24px 80px}
.ihero{background:var(--sidebar);border-radius:14px;padding:28px 32px;display:flex;align-items:center;gap:20px;color:#fff;margin-bottom:32px}
.ihero h1{margin:0;font-size:26px}.ihero p{margin:4px 0 0;color:var(--sidebar-text);font-size:13px}
.igroup{margin-bottom:28px}.igroup h2{font-size:12px;font-weight:700;color:var(--primary);margin:0 0 12px}
.igroup.st h2{color:var(--accent-dark)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;text-decoration:none;font-weight:600;font-size:13px;cursor:pointer}
.tile:hover{border-color:var(--primary);box-shadow:0 4px 12px rgba(38,42,122,.1)}
.tile i{font-style:normal;background:var(--primary-soft);color:var(--primary);border-radius:6px;padding:3px 7px;font-size:12px;font-weight:700;min-width:34px;text-align:center}
.igroup.st .tile i{background:var(--accent-soft);color:var(--accent-dark)}
.allbtn{position:fixed;left:16px;bottom:16px;z-index:40;display:inline-flex;align-items:center;gap:8px;height:33px;padding:0 15px;border-radius:999px;background:#fff;color:var(--primary);font-size:12px;font-weight:700;border:1px solid var(--border);box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:pointer;text-decoration:none}
/* overlays */
.overlay{position:fixed;inset:0;background:rgba(17,20,51,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:14px;padding:26px;width:100%;max-width:440px;box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:14px}
.modal h3{margin:0;font-size:18px}.modal p{margin:0;font-size:13px;color:var(--muted)}
.modal .box{background:var(--bg);border-radius:8px;padding:8px 12px}
.toast{position:fixed;right:32px;bottom:28px;z-index:60;background:var(--sidebar);color:#fff;border-radius:10px;padding:11px 16px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:14px;align-items:center;max-width:min(420px,calc(100vw - 40px))}
.toast.err{background:var(--danger)}
.toast a{color:#fff;font-weight:700;text-decoration:underline;cursor:pointer}
.sk{height:10px;border-radius:6px;background:linear-gradient(90deg,#eceef5 25%,#f6f7fb 50%,#eceef5 75%);background-size:200% 100%;animation:sh 1.3s infinite linear}
.sk.p{height:16px;border-radius:999px;width:70px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:44px 20px}
.empty .ic{width:56px;height:56px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
.empty h3{margin:4px 0 0;font-size:18px}.empty p{margin:0;max-width:460px;color:var(--muted);font-size:13px}
.errcard{max-width:520px;margin:120px auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px}
.errcard .ic{width:48px;height:48px;border-radius:50%;background:var(--danger-soft);color:var(--danger);display:grid;place-items:center;font-weight:800;font-size:20px}
.errcard h2{font-size:20px}.errcard p{margin:0;color:var(--muted);font-size:14px}
.msg{background:var(--bg);border-radius:8px;padding:12px 14px;font-size:13px}
.opt{display:flex;gap:12px;border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;align-items:flex-start}
.opt.on{border-color:var(--primary);background:var(--primary-soft)}
.opt input{width:18px;height:18px;accent-color:var(--primary);margin:2px 0 0}
.opt b{display:block;font-size:14px}.opt small{font-size:12px;color:var(--muted)}
.mtx td{text-align:center}.mtx td:first-child{text-align:left}
.yes{color:var(--success);font-weight:700}.q{color:var(--danger);font-weight:700}.no{color:var(--muted)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.split,.g2,.g3{grid-template-columns:minmax(0,1fr)!important}.signin{grid-template-columns:1fr}.bp{padding:40px 24px}.bp h1{font-size:30px;line-height:36px}}
@media (max-width:760px){.app{grid-template-columns:1fr}.side{position:static;height:auto;padding:20px 12px}.nav{flex-direction:row;flex-wrap:wrap}.nav a{height:34px}.brand{margin-bottom:14px}
.top,.content{padding-left:16px;padding-right:16px}.paper{padding:24px 18px}.paper .mf{grid-template-columns:1fr}.tiles,.g4{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div id="root"></div>
<a class="allbtn" href="#index" id="allbtn">☰ All screens</a>
<div id="layer"></div>

  const ur=document.getElementById('urole'); if(ur)ur.addEventListener('change',()=>{ST.urole=ur.value;render(true)});
  const er=document.getElementById('eurole'); if(er)er.addEventListener('change',()=>{ST.euRole=[ST.eu,er.value];render(true)});
  const ct=document.getElementById('ctc'); if(ct)ct.addEventListener('change',()=>{ST.ctCust=ct.value;render(true)});
  document.querySelectorAll('[data-res]').forEach(i=>i.addEventListener('change',()=>{PCR[ST.pc].v[i.dataset.res]=i.value;render(true)}));
  document.querySelectorAll('[data-rm]').forEach(i=>i.addEventListener('change',()=>{PCR[ST.pc].rm[i.dataset.rm]=i.value}));
  document.querySelectorAll('[data-bf]').forEach(i=>i.addEventListener('change',()=>{BCR[ST.bc][i.dataset.bf]=i.value;render(true)}));
  document.querySelectorAll('[data-bc]').forEach(i=>i.addEventListener('change',()=>{const[a,b]=i.dataset.bc.split('|');BCR[ST.bc].rows[+a][+b]=i.value;render(true)}));
  ['ncn','ncc'].forEach(k=>{const x=document.getElementById(k);if(x)x.addEventListener('input',dupCheck)});
}
document.addEventListener('click',e=>{
  const rq=e.target.closest('[data-rq]'); if(rq){const[k,v]=rq.dataset.rq.split(':');ST[k]=v}
  const vr=e.target.closest('[data-vr]'); if(vr){const[k,v]=vr.dataset.vr.split(':');ST.vrs=k;ST.vr=v}
  const b4=e.target.closest('[data-b24]'); if(b4)ST.b24=b4.dataset.b24;
  const g=e.target.closest('[data-go]'); if(g&&!g.disabled){e.preventDefault();nav(g.dataset.go);return}
  const p=e.target.closest('[data-param]'); if(p){p.checked?REQ.sel.add(p.dataset.param):REQ.sel.delete(p.dataset.param);render(true);return}
  if(e.target.id==='cpc'){REQ.pc=e.target.checked;render(true);return} if(e.target.id==='cbact'){REQ.bact=e.target.checked;render(true);return}
  const o=e.target.closest('[data-own]'); if(o){REQ.own=o.dataset.own;render(true);return}
  const r=e.target.closest('[data-rel]'); if(r){ST.rel=+r.dataset.rel;render(true);return}
  const w=e.target.closest('[data-wl]'); if(w){ST.wlSeg=+w.dataset.wl;render(true);return}
  const ust=e.target.closest('[data-ust]'); if(ust){ust.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===ust));return}
  const vs=e.target.closest('[data-vs]'); if(vs){ST.vSeg=vs.dataset.vs;render(true);return}
  const et=e.target.closest('[data-et]'); if(et){ST.editTab=et.dataset.et;render(true);return}
  const eu=e.target.closest('[data-eu]'); if(eu){ST.eu=+eu.dataset.eu;nav('35a');return}
  const au=e.target.closest('[data-aud]'); if(au){ST.audit=au.dataset.aud;render(true);return}
  const op=e.target.closest('[data-opt]'); if(op){op.closest('.opt').classList.toggle('on',op.checked);return}
  const ob=e.target.closest('[data-open]'); if(ob&&!e.target.closest('button,input,a')){const[k,v]=ob.dataset.open.split(':');ST[k]=v;nav(k==='pc'?'21':'22');return}
  const a=e.target.closest('[data-act]'); if(!a)return; e.preventDefault(); const act=a.dataset.act;
  if(act==='search')toast('Search updated');
  else if(act==='draft')toast('Draft saved at 10:42 AM');
  else if(act==='savefail')toast('Save failed · Retrying in 10 s','err','Retry now','21');
  else if(act==='submitpc'){const q=PCR[ST.pc];const miss=q.p.filter(k=>!(q.v[k]||'').trim());if(miss.length){toast(`Fill in ${miss.join(', ')} before submitting.`,'err');document.querySelector(`[data-res="${miss[0]}"]`)?.focus()}else{toast('Submitted for verification. Status: For Verification');setTimeout(()=>nav('20'),900)}}
  else if(act==='submitb'){const miss=bactMissing(BCR[ST.bc]);if(miss.length){toast(`Fill in ${miss.join(', ')} before submitting.`,'err');document.querySelector('[data-bf] , [data-bc]')&&[...document.querySelectorAll('[data-bf],[data-bc]')].find(i=>!i.value.trim())?.focus()}else{toast('Submitted for verification. Status: For Verification');setTimeout(()=>nav('20b'),900)}}
  else if(act==='savecust'){const ids=['ncn','nca','ncc'];let empty=false;ids.forEach(k=>{const x=document.getElementById(k);const bad=!x.value.trim();if(bad)empty=true;x.closest('.field').classList.toggle('err',bad)});if(empty){toast('Fill in the required fields.','err');return}if(dupCheck()){toast('This customer already exists.','err');return}toast('Customer saved · CUST-000124');setTimeout(()=>nav('12'),800)}
  else if(act==='clearcust'){['ncn','nca','ncc'].forEach(k=>{const x=document.getElementById(k);x.value='';x.closest('.field').classList.remove('err')});dupCheck()}
  else if(act==='pay'){const tot=reqTotal()[0];const v=parseFloat(document.getElementById('amt').value.replace(/,/g,''));const fld=document.getElementById('amt').closest('.field');const h=document.getElementById('amth');if(v!==tot){fld.classList.add('err');h.textContent=`Amount must equal the total payable: ${peso(tot)}. No receipt was issued.`}else{toast('Payment recorded · Temporary receipt TR-2026-00087 printed');setTimeout(()=>nav('14'),900)}}
  else if(act==='label'){ST.label=true;render(true);toast('Label LBL-2026-0146 sent to the printer')}
  else if(act==='release'){const v=document.getElementById('rcp').value.trim();if(!v){const fl=document.getElementById('rcp').closest('.field');fl.classList.add('err');if(!fl.querySelector('.help'))fl.insertAdjacentHTML('beforeend','<span class="help">Enter the name of the person claiming the results.</span>');return}ST.released.add(READY[ST.rel][0]);render(true);toast(`${READY[ST.rel][0]} marked as Released`)}
  else if(act==='start'){const[k,id]=a.dataset.rq.split(':');WLD[k==='pc'?'lab':'labb'].samples.forEach(r=>{if(r[0]===id)r[5]='Under Testing'});(k==='pc'?PCR:BCR)[id].st='Under Testing';toast('Status changed to Under Testing');setTimeout(()=>nav(a.dataset.to||'21'),800)}
  else if(act==='approve'){const id=ST.vr;if(ST.vrs==='pc'){PCR[id].st='Ready for Release';const qi=VQ.findIndex(x=>x[0]===id);if(qi>=0)VQ.splice(qi,1);toast('Results verified · Status: Ready for Release');setTimeout(()=>nav('30'),900);return}BCR[id].ver=['Ana Reyes','2026-11-26 10:50'];BCR[id].st='Ready for Release';ST.b24=id;toast('Results verified · Status: Ready for Release');setTimeout(()=>nav('24'),900)}
  else if(act==='return')openReturn();
  else if(act==='doreturn'){const t=document.getElementById('retc'),note=t.value.trim();if(!note){t.closest('.field').classList.add('err');document.getElementById('retch').textContent='Add a comment so the analyst knows what to fix.';t.focus();return}
    const id=ST.vr,pc=ST.vrs==='pc',r=pc?PCR[id]:BCR[id],d=new Date(),at=`2026-11-26 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    r.ret={note,at,by:'Ana Reyes (Administrator)',flag:[...document.querySelectorAll('[data-rf]:checked')].map(x=>x.dataset.rf)};r.st='Under Testing';
    const sub=WLD[pc?'lab':'labb'].sub,row=sub.find(x=>x[0]===id);if(row){row[3]='Returned for correction';row[4]=note}else sub.unshift([id,pc?r.src:r.loc,at,'Returned for correction',note]);
    const qi=VQ.findIndex(x=>x[0]===id);if(qi>=0)VQ.splice(qi,1);
    layer.innerHTML='';toast(`Returned to ${pc?'Paolo Garcia':'Liza Ramos'} for correction`);setTimeout(()=>nav('30'),900)}
  else if(act==='print')toast('Sent to the printer');
  else if(act==='export')toast('Report exported');
  else if(act==='gen')toast('Report generated for November 2026');
  else if(act==='confirm')openConfirm();
  else if(act==='confirmres')openConfirm(['Total Hardness','300','310','Typo in the submitted value']);
  else if(act==='confirmreq')openConfirm(['Sampling point','Well #1','Deep well #1','Customer clarified the sampling point']);
  else if(act==='usersave'){toast('Account updated and written to the audit log');setTimeout(()=>nav('35'),900)}
  else if(act==='usercreate'){toast('Account created. The user must change the password at first sign-in.');setTimeout(()=>nav('35'),1000)}
  else if(act==='unlock'){USERS[2][5]='OK';render(true);toast('Account unlocked')}
  else if(act==='deact'){USERS[ST.eu][4]='Inactive';render(true);toast('Account deactivated')}
  else if(act==='resetpw'){toast('Temporary password: Wl-7Kq2-Rt9m (shown once)')}
  else if(act==='close')layer.innerHTML='';
  else if(act==='saved'){layer.innerHTML='';toast('Change saved and written to the audit log');setTimeout(()=>nav('33'),900)}
  else if(act==='clear'){const i=document.getElementById('es');if(i){i.value='';i.focus()}}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.nav a,[data-go]:not(button)')){nav(e.target.dataset.go)}if(e.key==='Escape'&&cur==='34')layer.innerHTML=''});
window.addEventListener('hashchange',()=>render());
render();
}
</script>
</body>
